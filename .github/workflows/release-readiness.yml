name: release-readiness

on:
  pull_request:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-live-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt pytest catboost PyYAML Flask xgboost lxml

      - name: Check whitespace
        run: git diff --check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Verify review register
        run: python scripts/verify_review_register.py

      - name: Verify no-live release readiness
        shell: bash
        run: |
          set +e
          python scripts/verify_release.py --mode no-live
          status=$?
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "Release evidence remains BLOCKED."
          fi
          exit 0

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: reports/release_readiness/
          if-no-files-found: error
